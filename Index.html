<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartão Virtual</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  font-family:Arial, sans-serif;
  background:#080b10;
  color:#fff;
}

.container{
  width:100%;
  max-width:430px;
}

.logo{
  text-align:center;
  font-size:24px;
  font-weight:700;
  margin-bottom:25px;
  letter-spacing:.5px;
}

.card{
  position:relative;
  width:100%;
  height:235px;
  padding:25px;
  border-radius:22px;
  overflow:hidden;
  background:linear-gradient(135deg,#202832,#0c1118);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 25px 60px rgba(0,0,0,.45);
}

.card::before{
  content:"";
  position:absolute;
  width:220px;
  height:220px;
  right:-90px;
  top:-100px;
  border-radius:50%;
  background:rgba(255,255,255,.08);
}

.card-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.card-name{
  font-size:13px;
  opacity:.65;
  text-transform:uppercase;
  letter-spacing:1px;
}

.card-type{
  font-size:14px;
  font-weight:bold;
}

.chip{
  width:45px;
  height:34px;
  margin-top:45px;
  border-radius:8px;
  background:linear-gradient(135deg,#d8d8d8,#777);
  position:relative;
}

.chip::after{
  content:"";
  position:absolute;
  left:50%;
  top:0;
  width:1px;
  height:100%;
  background:#555;
}

.number{
  margin-top:22px;
  font-size:19px;
  letter-spacing:3px;
}

.card-bottom{
  position:absolute;
  bottom:22px;
  left:25px;
  right:25px;
  display:flex;
  justify-content:space-between;
}

.label{
  font-size:9px;
  opacity:.5;
  margin-bottom:4px;
  text-transform:uppercase;
}

.value{
  font-size:12px;
}

.message{
  margin-top:22px;
  padding:20px;
  border-radius:16px;
  background:#10161e;
  border:1px solid rgba(255,255,255,.08);
  text-align:center;
}

.message h2{
  font-size:18px;
  margin-bottom:9px;
}

.message p{
  color:#9ca7b5;
  font-size:14px;
  line-height:1.5;
}

.badge{
  display:inline-block;
  margin-top:14px;
  padding:8px 14px;
  border-radius:20px;
  background:#1b2430;
  color:#dce3eb;
  font-size:12px;
}

button{
  width:100%;
  margin-top:18px;
  padding:15px;
  border:0;
  border-radius:13px;
  background:#fff;
  color:#080b10;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">CARTÃO</div>

  <div class="card">

    <div class="card-top">
      <div class="card-name">Cartão Virtual</div>
      <div class="card-type">VIRTUAL</div>
    </div>

    <div class="chip"></div>

    <div class="number">
      •••• &nbsp; •••• &nbsp; •••• &nbsp; ••••
    </div>

    <div class="card-bottom">
      <div>
        <div class="label">Titular</div>
        <div class="value">NOVO UTILIZADOR</div>
      </div>

      <div>
        <div class="label">Validade</div>
        <div class="value">--/--</div>
      </div>

      <div>
        <div class="label">Status</div>
        <div class="value">PENDENTE</div>
      </div>
    </div>

  </div>

  <div class="message">
    <h2>Serviços em breve</h2>

    <p>
      Para novos utilizadores, os serviços de cartão virtual
      estarão disponíveis daqui a <strong>12 horas</strong>.
    </p>

    <div class="badge">
      Disponibilidade programada
    </div>
  </div>

  <button onclick="location.reload()">
    Atualizar disponibilidade
  </button>

</div>

</body>
</html>
